x-db-user: &db-user admin
x-db-password: &db-password admin123
x-db-name: &db-name farmacia

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: *db-user
      POSTGRES_PASSWORD: *db-password
      POSTGRES_DB: *db-name
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - pgdata18:/var/lib/postgresql
      - ./base/respaldo_farmacia.sql:/docker-entrypoint-initdb.d/01_respaldo.sql:ro
      - ./base/02_produccion.sql:/docker-entrypoint-initdb.d/02_produccion.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s
    restart: unless-stopped

  backend:
    build: ./farmacia-backend
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: *db-name
      DB_USER: *db-user
      DB_PASSWORD: *db-password
      JWT_SECRET: cambiar-este-secreto-en-produccion
      PORT: 3001
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/api/medicamento/estadisticas', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: on-failure

  frontend:
    build:
      context: ./farmacia-front/Farmacia_web
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata18:
  uploads:
