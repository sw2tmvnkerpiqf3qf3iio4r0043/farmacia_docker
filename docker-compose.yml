services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: farmacia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./base/00_preparar_dump.sh:/docker-entrypoint-initdb.d/00_preparar_dump.sh:ro
      - ./base/respaldo_farmacia.sql:/tmp/respaldo_farmacia.sql:ro
      - ./base/02_produccion.sql:/docker-entrypoint-initdb.d/02_produccion.sql:ro
    # >>> CAMBIO: Healthcheck que espera a que las tablas existan (no solo que Postgres arranque)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d farmacia && psql -U admin -d farmacia -c 'SELECT 1 FROM medicamento LIMIT 1;' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  backend:
    build: ./farmacia-backend
    pull_policy: missing
    ports:
      - "3001:3001"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: farmacia
      DB_USER: admin
      DB_PASSWORD: admin123
      JWT_SECRET: cambiar-este-secreto-en-produccion
      PORT: 3001
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    # >>> CAMBIO: Healthcheck propio para que el frontend espere a que esté listo
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/api/medicamento/estadisticas', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    # >>> CAMBIO: Reintenta automáticamente si falla
    restart: on-failure

  frontend:
    build:
      context: ./farmacia-front/Farmacia_web
      args:
        VITE_API_BASE_URL: /api
    pull_policy: missing
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  uploads: