services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: farmacia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./farmacia-backend
    ports:
      - "3001:3001"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: farmacia
      DB_USER: admin
      DB_PASSWORD: admin123
      PORT: 3001
    depends_on:
      - db
  frontend:
    build: ./farmacia-front/Farmacia_web
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  pgdata: