x-db-user: &db-user admin
x-db-password: &db-password admin123
x-db-name: &db-name farmacia

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: *db-user
      POSTGRES_PASSWORD: *db-password
      POSTGRES_DB: *db-name
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - pgdata18:/var/lib/postgresql
      - ./base/00_preparar_dump.sh:/docker-entrypoint-initdb.d/00_preparar_dump.sh:ro
      - ./base/respaldo_farmacia.sql:/tmp/farmacia-init/respaldo_farmacia.sql:ro
      - ./base/02_produccion.sql:/tmp/farmacia-init/02_produccion.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" && psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -c 'SELECT 1 FROM medicamento LIMIT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  backend:
    image: sole950/farmacia-backend:latest
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: *db-name
      DB_USER: *db-user
      DB_PASSWORD: *db-password
      JWT_SECRET: cambiar-este-secreto-en-produccion
      PORT: 3001
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/api/medicamento/estadisticas', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    deploy:
      replicas: 1

  frontend:
    image: sole950/farmacia-frontend:latest
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1

volumes:
  pgdata18:
  uploads:
