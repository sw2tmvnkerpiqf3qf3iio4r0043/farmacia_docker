    post:
      tags: [Alergias]
      summary: Asignar alergia a un cliente
      operationId: asignarAlergiaCliente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignarAlergiaRequest'
      responses:
        '201':
          description: Alergia asignada al cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteAlergia'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/alergia/cliente/{idCliente}:
    get:
      tags: [Alergias]
      summary: Listar alergias de un cliente
      operationId: getAlergiasByCliente
      parameters:
        - $ref: '#/components/parameters/IdClienteParam'
      responses:
        '200':
          description: Alergias del cliente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClienteAlergia'

  /api/alergia/cliente/{idCliente}/{idAlergia}:
    delete:
      tags: [Alergias]
      summary: Quitar alergia a un cliente
      operationId: quitarAlergiaCliente
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdClienteParam'
        - $ref: '#/components/parameters/IdAlergiaParam'
      responses:
        '204':
          description: Alergia quitada del cliente
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/alergia/validar/{idCliente}/{idMedicamento}:
    get:
      tags: [Alergias]
      summary: Validar si un cliente es alérgico a un medicamento
      description: Cruza cliente_alergia con alergia_principio_activo y medicamento_principio_activo
      operationId: validarAlergia
      parameters:
        - $ref: '#/components/parameters/IdClienteParam'
        - $ref: '#/components/parameters/IdMedicamentoParam'
      responses:
        '200':
          description: Resultado de la validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidacionAlergia'

  /api/alergia/{id}:
    get:
      tags: [Alergias]
      summary: Obtener alergia
      operationId: getAlergiaById
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Alergia encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alergia'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Alergias]
      summary: Actualizar alergia
      operationId: updateAlergia
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAlergiaRequest'
      responses:
        '200':
          description: Alergia actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alergia'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Alergias]
      summary: Eliminar alergia
      operationId: deleteAlergia
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Alergia eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
    IdMedicamentoParam:
      name: idMedicamento
      in: path
      required: true
      schema:
        type: integer
    IdLoteParam:
      name: idLote
      in: path
      required: true
      schema:
        type: integer
    IdUbicacionParam:
      name: idUbicacion
      in: path
      required: true
      schema:
        type: integer
    IdProveedorParam:
      name: idProveedor
      in: path
      required: true
      schema:
        type: integer
    IdClienteParam:
      name: idCliente
      in: path
      required: true
      schema:
        type: integer
    IdPagoParam:
      name: idPago
      in: path
      required: true
      schema:
        type: integer
    IdAlergiaParam:
      name: idAlergia
      in: path
      required: true
      schema:
        type: integer
    DiasQuery:
      name: dias
      in: query
      required: false
      description: Cantidad de días para considerar "próximo a vencer" (por defecto 30)
      schema:
        type: integer
        default: 30

  responses:
    ValidationError:
      description: Error de validación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto (recurso duplicado)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Sin permisos para realizar la acción
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [admin, user]
        createdAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        name:
          type: string
        role:
          type: string
          enum: [admin, user]
          default: user

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: JWT válido por 7 días

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email

    Medicamento:
      type: object
      properties:
        idMedicamento:
          type: integer
        codigoBarras:
          type: string
        nombreComercial:
          type: string
        nombreGenerico:
          type: string
        idCategoria:
          type: integer
        tipoProducto:
          type: string
        presentacion:
          type: string
        precioCompra:
          type: number
          format: float
        precioVenta:
          type: number
          format: float
        stock:
          type: integer
        requiereReceta:
          type: boolean
        activo:
          type: boolean
        imagen:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateMedicamentoRequest:
      type: object
      required: [nombreComercial]
      properties:
        codigoBarras:
          type: string
        nombreComercial:
          type: string
        nombreGenerico:
          type: string
        idCategoria:
          type: integer
        tipoProducto:
          type: string
        presentacion:
          type: string
        precioCompra:
          type: number
          format: float
        precioVenta:
          type: number
          format: float
        stock:
          type: integer
          default: 0
        requiereReceta:
          type: boolean
          default: false
        activo:
          type: boolean
          default: true
        imagen:
          type: string
          format: uri

    UpdateMedicamentoRequest:
      type: object
      properties:
        codigoBarras:
          type: string
        nombreComercial:
          type: string
        nombreGenerico:
          type: string
        idCategoria:
          type: integer
        tipoProducto:
          type: string
        presentacion:
          type: string
        precioCompra:
          type: number
        precioVenta:
          type: number
        stock:
          type: integer
        requiereReceta:
          type: boolean
        activo:
          type: boolean
        imagen:
          type: string
          format: uri

    MedicamentoStats:
      type: object
      properties:
        totalMedicamentos:
          type: integer
        totalUnidadesInventario:
          type: integer
        valorTotalInventario:
          type: number
        totalRequiereReceta:
          type: integer
        totalStockCritico:
          type: integer
        totalAgotados:
          type: integer

    MedicamentoConOferta:
      allOf:
        - $ref: '#/components/schemas/Medicamento'
        - type: object
          properties:
            precioOriginal:
              type: number
            porcentajeDescuento:
              type: number
            precioConDescuento:
              type: number
            nombreOferta:
              type: string
            vencimientoOferta:
              type: string
              format: date

    Categoria:
      type: object
      properties:
        id_categoria:
          type: integer
        nombre:
          type: string
        descripcion:
          type: string
        tipo_categoria:
          type: string
          enum: [medicamento, parafarmacia, dermocosmetica, higiene, salud, nutricion, bebe, general]
        tipo_enfermedad:
          type: string
          enum: [cronica, estacional, aguda, bienestar, prevencion, cuidado_personal, infantil, nutricion, general, no_aplica]
        id_categoria_padre:
          type: integer
          nullable: true
        nombre_categoria_padre:
          type: string
          description: Nombre enriquecido de la categoría padre
        fecha_creacion:
          type: string
          format: date-time

    CreateCategoriaRequest:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          description: Nombre único de la categoría
        descripcion:
          type: string
        tipo_categoria:
          type: string
          enum: [medicamento, parafarmacia, dermocosmetica, higiene, salud, nutricion, bebe, general]
          default: medicamento
        tipo_enfermedad:
          type: string
          enum: [cronica, estacional, aguda, bienestar, prevencion, cuidado_personal, infantil, nutricion, general, no_aplica]
          default: general
        id_categoria_padre:
          type: integer
          description: ID de la categoría padre (para subcategorías)

    UpdateCategoriaRequest:
      type: object
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        tipo_categoria:
          type: string
          enum: [medicamento, parafarmacia, dermocosmetica, higiene, salud, nutricion, bebe, general]
        tipo_enfermedad:
          type: string
          enum: [cronica, estacional, aguda, bienestar, prevencion, cuidado_personal, infantil, nutricion, general, no_aplica]
        id_categoria_padre:
          type: integer
          nullable: true

    Oferta:
      type: object
      properties:
        idOferta:
          type: integer
        nombreOferta:
          type: string
        descripcion:
          type: string
        porcentajeDescuento:
          type: number
          format: float
        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time
        activo:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateOfertaRequest:
      type: object
      required: [nombreOferta, porcentajeDescuento, fechaInicio, fechaFin]
      properties:
        nombreOferta:
          type: string
        descripcion:
          type: string
        porcentajeDescuento:
          type: number
          minimum: 0
          maximum: 100
        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time
        activo:
          type: boolean
          default: true

    UpdateOfertaRequest:
      type: object
      properties:
        nombreOferta:
          type: string
        descripcion:
          type: string
        porcentajeDescuento:
          type: number
          minimum: 0
          maximum: 100
        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time
        activo:
          type: boolean

    OfertaMedicamento:
      type: object
      properties:
        idOfertaMedicamento:
          type: integer
        idOferta:
          type: integer
        idMedicamento:
          type: integer
        fechaAsignacion:
          type: string
          format: date-time
        createdBy:
          type: integer

    Ubicacion:
      type: object
      properties:
        idUbicacion:
          type: integer
        idSucursal:
          type: integer
        sucursal:
          type: string
        nombre:
          type: string
        pasillo:
          type: string
          nullable: true
        estante:
          type: string
          nullable: true
        temperaturaRecomendada:
          type: string
          nullable: true
        activa:
          type: boolean
        fechaCreacion:
          type: string
          format: date-time

    CreateUbicacionRequest:
      type: object
      required: [idSucursal, nombre]
      properties:
        idSucursal:
          type: integer
        nombre:
          type: string
        pasillo:
          type: string
        estante:
          type: string
        temperaturaRecomendada:
          type: string
        activa:
          type: boolean
          default: true

    UpdateUbicacionRequest:
      type: object
      properties:
        idSucursal:
          type: integer
        nombre:
          type: string
        pasillo:
          type: string
          nullable: true
        estante:
          type: string
          nullable: true
        temperaturaRecomendada:
          type: string
          nullable: true
        activa:
          type: boolean

    Lote:
      type: object
      properties:
        idLote:
          type: integer
        idMedicamento:
          type: integer
        medicamento:
          type: string
        idProveedor:
          type: integer
          nullable: true
        proveedor:
          type: string
          nullable: true
        numeroLote:
          type: string
        fechaFabricacion:
          type: string
          format: date
        fechaVencimiento:
          type: string
          format: date
        cantidadInicial:
          type: integer
        estado:
          type: string
          enum: [activo, agotado, cuarentena, vencido, devuelto]
        fechaIngreso:
          type: string
          format: date-time
        observaciones:
          type: string
          nullable: true

    CreateLoteRequest:
      type: object
      required: [idMedicamento, numeroLote, fechaFabricacion, fechaVencimiento, cantidadInicial]
      properties:
        idMedicamento:
          type: integer
        idProveedor:
          type: integer
          nullable: true
        numeroLote:
          type: string
        fechaFabricacion:
          type: string
          format: date
        fechaVencimiento:
          type: string
          format: date
        cantidadInicial:
          type: integer
          minimum: 1
        estado:
          type: string
          enum: [activo, agotado, cuarentena, vencido, devuelto]
          default: activo
        observaciones:
          type: string

    UpdateLoteRequest:
      type: object
      properties:
        idMedicamento:
          type: integer
        idProveedor:
          type: integer
          nullable: true
        numeroLote:
          type: string
        fechaFabricacion:
          type: string
          format: date
        fechaVencimiento:
          type: string
          format: date
        cantidadInicial:
          type: integer
          minimum: 1
        estado:
          type: string
          enum: [activo, agotado, cuarentena, vencido, devuelto]
        observaciones:
          type: string

    CambiarEstadoLoteRequest:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [activo, agotado, cuarentena, vencido, devuelto]

    Inventario:
      type: object
      properties:
        idInventario:
          type: integer
        idLote:
          type: integer
        numeroLote:
          type: string
        idMedicamento:
          type: integer
        medicamento:
          type: string
        idUbicacion:
          type: integer
        ubicacion:
          type: string
        cantidadActual:
          type: integer
        stockMinimo:
          type: integer
        stockMaximo:
          type: integer
          nullable: true
        fechaActualizacion:
          type: string
          format: date-time

    CreateInventarioRequest:
      type: object
      required: [idLote, idUbicacion]
      properties:
        idLote:
          type: integer
        idUbicacion:
          type: integer
        cantidadActual:
          type: integer
          minimum: 0
          default: 0
        stockMinimo:
          type: integer
          minimum: 0
          default: 0
        stockMaximo:
          type: integer
          nullable: true

    UpdateInventarioRequest:
      type: object
      properties:
        idLote:
          type: integer
        idUbicacion:
          type: integer
        cantidadActual:
          type: integer
          minimum: 0
        stockMinimo:
          type: integer
          minimum: 0
        stockMaximo:
          type: integer
          nullable: true

    Proveedor:
      type: object
      properties:
        idProveedor:
          type: integer
        nombreEmpresa:
          type: string
        contactoNombre:
          type: string
        contactoTelefono:
          type: string
        contactoEmail:
          type: string
          nullable: true
        aceptaDevoluciones:
          type: boolean
        frecuenciaVisita:
          type: string
        fechaRegistro:
          type: string
          format: date-time
        activo:
          type: boolean

    CreateProveedorRequest:
      type: object
      required: [nombreEmpresa, contactoNombre, contactoTelefono]
      properties:
        nombreEmpresa:
          type: string
        contactoNombre:
          type: string
        contactoTelefono:
          type: string
        contactoEmail:
          type: string
          format: email
        aceptaDevoluciones:
          type: boolean
          default: true
        frecuenciaVisita:
          type: string
          default: semanal
        activo:
          type: boolean
          default: true

    UpdateProveedorRequest:
      type: object
      properties:
        nombreEmpresa:
          type: string
        contactoNombre:
          type: string
        contactoTelefono:
          type: string
        contactoEmail:
          type: string
          format: email
        aceptaDevoluciones:
          type: boolean
        frecuenciaVisita:
          type: string
        activo:
          type: boolean

    DetalleCompra:
      type: object
      properties:
        idDetalleCompra:
          type: integer
        idMedicamento:
          type: integer
        medicamento:
          type: string
        idLote:
          type: integer
          nullable: true
        numeroLote:
          type: string
          nullable: true
        cantidad:
          type: integer
        precioUnitario:
          type: number
        subtotal:
          type: number

    DetalleCompraInput:
      type: object
      required: [idMedicamento, cantidad, precioUnitario]
      properties:
        idMedicamento:
          type: integer
        idLote:
          type: integer
          nullable: true
        cantidad:
          type: integer
          minimum: 1
        precioUnitario:
          type: number
          minimum: 0

    Compra:
      type: object
      properties:
        idCompra:
          type: integer
        idProveedor:
          type: integer
        proveedor:
          type: string
        numeroFactura:
          type: string
        fechaCompra:
          type: string
          format: date
        totalCompra:
          type: number
        estado:
          type: string
          enum: [pendiente, completada, devuelta_parcial, devuelta_total]
        observaciones:
          type: string
          nullable: true
        fechaRegistro:
          type: string
          format: date-time
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleCompra'

    CreateCompraRequest:
      type: object
      required: [idProveedor, numeroFactura, detalles]
      properties:
        idProveedor:
          type: integer
        numeroFactura:
          type: string
        fechaCompra:
          type: string
          format: date
        estado:
          type: string
          enum: [pendiente, completada, devuelta_parcial, devuelta_total]
          default: pendiente
        observaciones:
          type: string
        idUbicacion:
          type: integer
          description: Ubicación destino para la entrada de inventario (por defecto la primera activa)
        detalles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DetalleCompraInput'

    UpdateCompraRequest:
      type: object
      properties:
        idProveedor:
          type: integer
        numeroFactura:
          type: string
        fechaCompra:
          type: string
          format: date
        estado:
          type: string
          enum: [pendiente, completada, devuelta_parcial, devuelta_total]
        observaciones:
          type: string
        detalles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DetalleCompraInput'

    CambiarEstadoCompraRequest:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [pendiente, completada, devuelta_parcial, devuelta_total]
        idUbicacion:
          type: integer

    DetalleReceta:
      type: object
      properties:
        idDetalleReceta:
          type: integer
        idMedicamento:
          type: integer
          nullable: true
        medicamento:
          type: string
          nullable: true
        dosis:
          type: string
        frecuencia:
          type: string
        viaAdministracion:
          type: string
        duracionTratamiento:
          type: string
        cantidadPrescrita:
          type: integer
        indicaciones:
          type: string
          nullable: true

    DetalleRecetaInput:
      type: object
      required: [dosis, frecuencia, viaAdministracion, duracionTratamiento]
      properties:
        idMedicamento:
          type: integer
          nullable: true
        dosis:
          type: string
        frecuencia:
          type: string
        viaAdministracion:
          type: string
        duracionTratamiento:
          type: string
        cantidadPrescrita:
          type: integer
          minimum: 1
          default: 1
        indicaciones:
          type: string

    Receta:
      type: object
      properties:
        idReceta:
          type: integer
        idCliente:
          type: integer
        cliente:
          type: string
        numeroReceta:
          type: string
        medicoPrescriptor:
          type: string
        fechaEmision:
          type: string
          format: date
        fechaRegistroFarmacia:
          type: string
          format: date-time
        fechaVencimiento:
          type: string
          format: date
        observacionesReceta:
          type: string
          nullable: true
        estado:
          type: string
          enum: [vigente, usada, vencida, anulada]
        detalles:
