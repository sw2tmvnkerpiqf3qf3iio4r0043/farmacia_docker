openapi: 3.0.3
info:
  title: Farmacia API
  description: |
    API REST para la gestión de farmacia y medicamentos.
    Permite gestionar:
    - Catálogo de medicamentos (códigos de barra, nombres, precios, stock, recetas)
    - Categorías de medicamentos (jerarquía padre-hijo)
    - Ofertas y descuentos temporales
    - Relación oferta-medicamento
    - Autenticación de usuarios (JWT)
    - Control de inventario y stock
    
    ## Autenticación
    La mayoría de endpoints requieren un token JWT:
    `Authorization: Bearer <token>`
  version: 2.0.0
  contact:
    name: API Support
    email: support@farmacia.com
servers:
  - url: http://localhost:3001
    description: Servidor de desarrollo

tags:
  - name: Auth
    description: Registro, login y perfil de usuario
  - name: Medicamentos
    description: Gestión de medicamentos e inventario
  - name: Categorias
    description: Gestión de categorías de medicamentos (jerarquía padre-hijo)
  - name: Ofertas
    description: Gestión de ofertas y descuentos
  - name: Oferta-Medicamento
    description: Relación entre ofertas y medicamentos
  - name: Ubicaciones
    description: Gestión de ubicaciones de inventario
  - name: Lotes
    description: Gestión de lotes y control FEFO
  - name: Inventario
    description: Control de existencias por lote y ubicación
  - name: Proveedores
    description: Gestión de proveedores
  - name: Compras
    description: Registro de compras y su detalle
  - name: Recetas
    description: Gestión de recetas médicas y su detalle
  - name: Ventas
    description: Ventas, pagos mixtos, comprobantes y anulación con descuento FEFO
  - name: Alergias
    description: Gestión de alergias y validación por cliente

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Registrar usuario
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Obtener perfil
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Auth]
      summary: Actualizar perfil
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/medicamento:
    get:
      tags: [Medicamentos]
      summary: Listar todos los medicamentos
      operationId: listMedicamentos
      responses:
        '200':
          description: Lista de medicamentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Medicamento'
    post:
      tags: [Medicamentos]
      summary: Crear medicamento
      operationId: createMedicamento
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMedicamentoRequest'
      responses:
        '201':
          description: Medicamento creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medicamento'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/medicamento/estadisticas:
    get:
      tags: [Medicamentos]
      summary: Estadísticas del inventario
      description: Obtiene total de medicamentos, valor del inventario, stock crítico, etc.
      operationId: getEstadisticas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estadísticas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicamentoStats'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/medicamento/stock-critico:
    get:
      tags: [Medicamentos]
      summary: Medicamentos con stock crítico
      description: Retorna medicamentos con stock <= 10
      operationId: getStockCritico
      responses:
        '200':
          description: Lista de medicamentos con stock crítico
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Medicamento'

  /api/medicamento/sin-stock:
    get:
      tags: [Medicamentos]
      summary: Medicamentos agotados
      description: Retorna medicamentos con stock = 0
      operationId: getSinStock
      responses:
        '200':
          description: Lista de medicamentos agotados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Medicamento'

  /api/medicamento/con-oferta:
    get:
      tags: [Medicamentos]
      summary: Medicamentos con oferta activa
      description: Retorna medicamentos con ofertas vigentes (JOIN de 3 tablas)
      operationId: getMedicamentosConOferta
      responses:
        '200':
          description: Lista de medicamentos con oferta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MedicamentoConOferta'

  /api/medicamento/buscar:
    get:
      tags: [Medicamentos]
      summary: Buscar medicamentos por nombre
      operationId: buscarPorNombre
      parameters:
        - name: nombre
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resultados de búsqueda
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Medicamento'

  /api/medicamento/{id}:
    get:
      tags: [Medicamentos]
      summary: Obtener medicamento por ID
      operationId: getMedicamentoById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalle del medicamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medicamento'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Medicamentos]
      summary: Actualizar medicamento
      operationId: updateMedicamento
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMedicamentoRequest'
      responses:
        '200':
          description: Medicamento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medicamento'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Medicamentos]
      summary: Eliminar medicamento
      operationId: deleteMedicamento
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Medicamento eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/medicamento/{id}/stock:
    patch:
      tags: [Medicamentos]
      summary: Actualizar stock incrementalmente
      description: Suma o resta stock sin necesidad de enviar todo el objeto
      operationId: actualizarStock
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cantidad, operacion]
              properties:
                cantidad:
                  type: integer
                  minimum: 1
                operacion:
                  type: string
                  enum: [sumar, restar]
      responses:
        '200':
          description: Stock actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medicamento'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/categoria:
    get:
      tags: [Categorias]
      summary: Listar todas las categorías
      description: Retorna todas las categorías con su categoría padre enriquecida
      operationId: listCategorias
      responses:
        '200':
          description: Lista de categorías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
    post:
      tags: [Categorias]
      summary: Crear categoría
      operationId: createCategoria
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoriaRequest'
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/categoria/{id}:
    get:
      tags: [Categorias]
      summary: Obtener categoría por ID
      operationId: getCategoriaById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalle de categoría
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Categorias]
      summary: Actualizar categoría
      operationId: updateCategoria
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoriaRequest'
      responses:
        '200':
          description: Categoría actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Categorias]
      summary: Eliminar categoría
      operationId: deleteCategoria
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Categoría eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/oferta:
    get:
      tags: [Ofertas]
      summary: Listar todas las ofertas
      operationId: listOfertas
      responses:
        '200':
          description: Lista de ofertas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Oferta'
    post:
      tags: [Ofertas]
      summary: Crear oferta
      operationId: createOferta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOfertaRequest'
      responses:
        '201':
          description: Oferta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Oferta'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/oferta/activas:
    get:
      tags: [Ofertas]
      summary: Ofertas activas vigentes
      description: Retorna ofertas con fecha_fin >= hoy
      operationId: getOfertasActivas
      responses:
        '200':
          description: Ofertas activas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Oferta'

  /api/oferta/{id}:
    get:
      tags: [Ofertas]
      summary: Obtener oferta por ID
      operationId: getOfertaById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalle de oferta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Oferta'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Ofertas]
      summary: Actualizar oferta
      operationId: updateOferta
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOfertaRequest'
      responses:
        '200':
          description: Oferta actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Oferta'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Ofertas]
      summary: Eliminar oferta
      operationId: deleteOferta
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Oferta eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/oferta/{id}/medicamentos:
    get:
      tags: [Oferta-Medicamento]
      summary: Medicamentos de esta oferta
      operationId: getMedicamentosDeOferta
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de medicamentos con esta oferta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MedicamentoConOferta'
    post:
      tags: [Oferta-Medicamento]
      summary: Asignar medicamento a esta oferta
      operationId: asignarMedicamentoAOferta
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idMedicamento]
              properties:
                idMedicamento:
                  type: integer
      responses:
        '201':
          description: Medicamento asignado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaMedicamento'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/oferta/{id}/medicamentos/{idMedicamento}:
    delete:
      tags: [Oferta-Medicamento]
      summary: Eliminar relación oferta-medicamento
      operationId: eliminarRelacionOfertaMedicamento
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: idMedicamento
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Relación eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/oferta-medicamento/activas-con-productos:
    get:
      tags: [Oferta-Medicamento]
      summary: Todas las ofertas activas con sus productos
      description: Retorna todas las ofertas vigentes con sus medicamentos asignados y precios calculados
      operationId: getOfertasActivasConProductos
      responses:
        '200':
          description: Lista de ofertas activas con productos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    idOferta:
                      type: integer
                    nombreOferta:
                      type: string
                    descripcion:
                      type: string
                    porcentajeDescuento:
                      type: number
                    fechaInicio:
                      type: string
                      format: date-time
                    fechaFin:
                      type: string
                      format: date-time
                    productos:
                      type: array
                      items:
                        $ref: '#/components/schemas/MedicamentoConOferta'

  /api/ubicacion:
    get:
      tags: [Ubicaciones]
      summary: Listar ubicaciones
      operationId: listUbicaciones
      responses:
        '200':
          description: Lista de ubicaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ubicacion'
    post:
      tags: [Ubicaciones]
      summary: Crear ubicación
      operationId: createUbicacion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUbicacionRequest'
      responses:
        '201':
          description: Ubicación creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ubicacion'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/ubicacion/{id}:
    get:
      tags: [Ubicaciones]
      summary: Obtener ubicación
      operationId: getUbicacionById
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Ubicación encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ubicacion'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Ubicaciones]
      summary: Actualizar ubicación
      operationId: updateUbicacion
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUbicacionRequest'
      responses:
        '200':
          description: Ubicación actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ubicacion'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Ubicaciones]
      summary: Eliminar ubicación
      operationId: deleteUbicacion
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Ubicación eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/lote:
    get:
      tags: [Lotes]
      summary: Listar lotes
      operationId: listLotes
      responses:
        '200':
          description: Lista de lotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lote'
    post:
      tags: [Lotes]
      summary: Crear lote
      operationId: createLote
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLoteRequest'
      responses:
        '201':
          description: Lote creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lote'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/lote/proximos-vencer:
    get:
      tags: [Lotes]
      summary: Lotes próximos a vencer (FEFO)
      operationId: getLotesProximosVencer
      parameters:
        - $ref: '#/components/parameters/DiasQuery'
      responses:
        '200':
          description: Lotes activos próximos a vencer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lote'

  /api/lote/medicamento/{idMedicamento}:
    get:
      tags: [Lotes]
      summary: Listar lotes por medicamento
      operationId: getLotesByMedicamento
      parameters:
        - $ref: '#/components/parameters/IdMedicamentoParam'
      responses:
        '200':
          description: Lotes del medicamento
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lote'

  /api/lote/{id}:
    get:
      tags: [Lotes]
      summary: Obtener lote
      operationId: getLoteById
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Lote encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lote'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Lotes]
      summary: Actualizar lote
      operationId: updateLote
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLoteRequest'
      responses:
        '200':
          description: Lote actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lote'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Lotes]
      summary: Eliminar lote
      operationId: deleteLote
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Lote eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
