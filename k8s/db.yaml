apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: farmacia-db
  labels:
    app: farmacia-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: farmacia-db
  template:
    metadata:
      labels:
        app: farmacia-db
    spec:
      securityContext:
        fsGroup: 70
      initContainers:
        - name: fix-permissions
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              echo "[init] Limpiando TODO el volumen de datos..."
              rm -rf /var/lib/postgresql/data/*
              rm -rf /var/lib/postgresql/data/.[!.]*
              echo "[init] Volumen limpio. Preparando permisos..."
              chown -R 70:70 /var/lib/postgresql/data
              chmod 700 /var/lib/postgresql/data
              echo "[init] Listo."
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: admin
            - name: POSTGRES_PASSWORD
              value: admin123
            - name: POSTGRES_DB
              value: farmacia
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -p 5432 -U admin -d farmacia
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -p 5432 -U admin -d farmacia
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-scripts
          configMap:
            name: farmacia-db-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: farmacia-db-service
spec:
  selector:
    app: farmacia-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres