apiVersion: apps/v1
kind: Deployment
metadata:
  name: farmacia-frontend
  labels:
    app: farmacia-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: farmacia-frontend
  template:
    metadata:
      labels:
        app: farmacia-frontend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: sole950/farmacia-frontend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: VITE_API_URL
              value: ""
            - name: BACKEND_UPSTREAM
              value: "farmacia-backend-service"
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: farmacia-frontend-service
spec:
  selector:
    app: farmacia-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
  type: NodePort
